version: 3

env:
  TERM: screen-256color

tasks:
  default:
    cmds:
      - task: test

  test:
    desc: Run tests
    cmds:
      - go fmt ./...
      - go vet -v ./...
      - go test -race -v ./...

  build:
    desc: Build the binary.
    cmds:
      - task: test
      - goreleaser --snapshot --clean

  install:
    desc: Install the binary
    cmds:
      - go install ./cmd/tfcheck

  docker:build:
    desc: Build the docker image
    cmds:
      - docker build -t itsdalmo/tfcheck:dev .

  docker:run:
    desc: Run tfcheck container against infrastructure repository
    cmds:
      - docker run -it -v /Users/dalmo/code/github.com/itsdalmo/infrastructure:/infra -w /infra --rm itsdalmo/tfcheck:dev
